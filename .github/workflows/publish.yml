name: Publish package
run-name: Publish ${{ github.ref_name }}
on:
  push:
    tags: ['*-v*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TOOL_SHA: ${{ vars.RELEASE_TOOL_SHA }}
      RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
    steps:
      - name: 共通ツールの固定を確認
        run: test "${#RELEASE_TOOL_SHA}" -eq 40 && [[ "$RELEASE_TOOL_SHA" =~ ^[a-f0-9]+$ ]]
      - name: リリース用Appからのイベントを確認
        env:
          EVENT_ACTOR: ${{ github.actor }}
        run: test -n "$RELEASE_BOT_LOGIN" && test "$EVENT_ACTOR" = "$RELEASE_BOT_LOGIN"
      - uses: actions/create-github-app-token@v2
        id: tools-reader
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: mathrunet
          repositories: masamune
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          path: package-repo
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mathrunet/masamune
          token: ${{ steps.tools-reader.outputs.token }}
          ref: ${{ vars.RELEASE_TOOL_SHA }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.1
      - uses: ./.release-tools/.github/actions/package-release
        env:
          GH_TOKEN: ${{ steps.tools-reader.outputs.token }}
        with:
          mode: publish
